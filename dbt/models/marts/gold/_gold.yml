version: 2

models:
  - name: dim_month
    config:
      contract:
        enforced: true
    description: >
      The calendar month dimension: one row per month from 1833-01 to the
      current month. The fact's population is set here, not by whichever months
      the publisher happened to price.
    columns:
      - name: month_start
        description: The first day of the month.
        data_type: DATE
        data_tests: [not_null, unique]
      - name: calendar_year
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        data_tests: [not_null]
      - name: calendar_month
        data_type: INTEGER
        meta:
          additivity: not_a_measure
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 12}

  - name: fct_gold_price_month
    config:
      contract:
        enforced: true
    description: >
      One row per month on the `dim_month` spine: the gold price in US dollars
      per troy ounce. Null for a month the publisher has not priced yet, which
      is normally the current one.
    columns:
      - name: month_start
        data_type: DATE
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_month')
                field: month_start
      - name: price_usd_per_troy_oz
        description: A price, so it never sums.
        data_type: DOUBLE
        meta:
          additivity: non_additive
