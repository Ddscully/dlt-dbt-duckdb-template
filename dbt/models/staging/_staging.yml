version: 2

models:
  - name: stg_gold_prices
    config:
      group: gold
    description: >
      Gold prices, one row per `price_month` (the first day of the month).
    columns:
      - name: price_month
        data_tests: [not_null, unique]
      - name: price_usd_per_troy_oz
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
