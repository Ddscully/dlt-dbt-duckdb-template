name: "my_warehouse"
version: "0.1.0"
config-version: 2

profile: "my_warehouse"

# A model version's `deprecation_date` is a promise to whoever reads it. Once
# the date passes, dbt by default logs a warning and exits 0; promoted here, it
# fails `dbt parse` — CI's cheapest step — so a migration window that has run out
# cannot be ignored.
#
# * `DeprecatedModel` — the date has passed (fires at parse, on the producer).
# * `DeprecatedReference` — a `ref` to a model past its date.
#
# `UpcomingReferenceDeprecation` stays a warning: a ref inside the migration
# window is what the window is for. Not `error: all`, which would fail the build
# on any warning a future dbt adds.
flags:
  warn_error_options:
    error:
      - DeprecatedModel
      - DeprecatedReference

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]


models:
  my_warehouse:
    staging:
      +materialized: view
      +schema: staging
      # A group's working copy of a source, not an interface: only models in the
      # same group may `ref` it. One group that has to read another's cleaning
      # layer sets `access: protected` on that model — visibly, one model at a
      # time, rather than by widening this.
      +access: private
    # An `intermediate:` block goes here when models/intermediate/ exists. dbt
    # warns on config for a directory with no models in it, so it is commented
    # rather than left waiting:
    #
    #   intermediate:
    #     # `view`, not `ephemeral`: an ephemeral model has no relation, so it
    #     # cannot carry the unit tests these exist for.
    #     +materialized: view
    #     +schema: intermediate
    #     # Each is consumed only inside its own group.
    #     +access: private
    marts:
      +materialized: table
      +schema: marts
      # The interface. Everything outside dbt — the dashboard, a notebook,
      # another project — reads a mart and nothing else.
      +access: public
      # One folder per subject area, matching `_groups.yml`, so `+group:` is set
      # per folder. Every folder inherits `+schema: marts`, so relation names and
      # asset keys ignore the nesting.
      gold:
        +group: gold


# Uncomment with the first snapshot; dbt warns about config that applies to
# nothing. A snapshot is *state*: it cannot be recomputed, and deleting
# data/warehouse.duckdb destroys it, so keep snapshots narrow.
#
# snapshots:
#   my_warehouse:
#     +schema: history

data_tests:
  # Each test's failing rows land in `dbt_test__audit.<test alias>`, so a red
  # check comes with the rows rather than a count.
  +store_failures: true
  +schema: dbt_test__audit
